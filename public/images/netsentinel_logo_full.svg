<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 550" width="100%" height="100%" style="background-color: #0B1120;">
  <!-- Definitions for Gradients and Glow Effects -->
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Protective Shield -->
  <path d="M 250,50 L 410,100 C 410,280 340,380 250,430 C 160,380 90,280 90,100 Z" 
        fill="url(#shieldGrad)" stroke="#0EA5E9" stroke-width="6" filter="url(#glow)"/>

  <!-- Inner Shield Accent -->
  <path d="M 250,68 L 390,112 C 390,265 328,355 250,400 C 172,355 110,265 110,112 Z" 
        fill="#0B132B" stroke="#38BDF8" stroke-width="2" opacity="0.8"/>

  <!-- Central Radar / Target Reticle -->
  <circle cx="250" cy="220" r="70" fill="none" stroke="#0EA5E9" stroke-width="3" stroke-dasharray="8,6" opacity="0.85"/>
  <circle cx="250" cy="220" r="45" fill="#0284C7" fill-opacity="0.15" stroke="#38BDF8" stroke-width="2"/>
  <circle cx="250" cy="220" r="12" fill="#38BDF8" filter="url(#glow)"/>

  <!-- Network Topology Nodes & Connections -->
  <line x1="250" y1="220" x2="190" y2="150" stroke="#38BDF8" stroke-width="3"/>
  <line x1="250" y1="220" x2="310" y2="150" stroke="#38BDF8" stroke-width="3"/>
  <line x1="250" y1="220" x2="180" y2="280" stroke="#38BDF8" stroke-width="3"/>
  <line x1="250" y1="220" x2="320" y2="280" stroke="#0EA5E9" stroke-width="3"/>

  <circle cx="190" cy="150" r="9" fill="#38BDF8" stroke="#0B1120" stroke-width="2"/>
  <circle cx="310" cy="150" r="9" fill="#38BDF8" stroke="#0B1120" stroke-width="2"/>
  <circle cx="180" cy="280" r="9" fill="#38BDF8" stroke="#0B1120" stroke-width="2"/>
  
  <!-- Alert Threat Node (Red Accent) -->
  <circle cx="320" cy="280" r="10" fill="#EF4444" stroke="#0B1120" stroke-width="2" filter="url(#glow)"/>

  <!-- Divider Line -->
  <line x1="140" y1="465" x2="360" y2="465" stroke="#0EA5E9" stroke-width="2" opacity="0.8"/>
  <circle cx="250" cy="465" r="5" fill="#38BDF8"/>

  <!-- Typography -->
  <text x="250" y="500" fill="#F8FAFC" font-family="'Segoe UI', Roboto, Helvetica, sans-serif" font-size="28" font-weight="800" text-anchor="middle" letter-spacing="4">NETSENTINEL</text>
  <text x="250" y="522" fill="#94A3B8" font-family="'Segoe UI', Roboto, Helvetica, sans-serif" font-size="10" font-weight="600" text-anchor="middle" letter-spacing="1.5">REAL-TIME PACKET ANALYSIS &amp; THREAT DETECTION</text>
</svg>
